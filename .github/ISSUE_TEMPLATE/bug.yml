title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "## Please do not paste credentials or API keys"
  - type: input
    id: version
    attributes:
      label: Version
      description: "Electron app version (Help → About)"
  - type: input
    id: os
    attributes:
      label: OS
      description: "e.g. macOS 15.0 / Windows 11 / Ubuntu 24.04"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: "How can we reproduce the bug?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Open Logs from menu → Copy any relevant output (credentials will be redacted)"
