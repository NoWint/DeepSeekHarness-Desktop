appId: com.nowint.deepseekharness
productName: DeepSeek Harness
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: out
  buildResources: build
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - dist/**/*.node
  - resources/node/**
  - resources/harness/**
extraResources:
  - from: resources/node
    to: node
    filter:
      - "**/*"
  - from: resources/harness
    to: harness
    filter:
      - "**/*"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
